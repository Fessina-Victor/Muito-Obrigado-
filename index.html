<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Muito Obrigado! — WebAR</title>

  <!-- MindAR + A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #start {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #06152b 0%, #000 70%);
      color: #fff; font-family: Arial, sans-serif; text-align: center;
    }
    #start .box {
      max-width: 330px; padding: 28px 22px; border: 1px solid #00aaff;
      border-radius: 18px; box-shadow: 0 0 30px #008cff55;
    }
    #start h1 { color: #54d8ff; margin: 0 0 12px; }
    #start p { line-height: 1.45; color: #d8f5ff; }
    #start button {
      border: 0; border-radius: 999px; padding: 14px 24px;
      background: #00aaff; color: #00101a; font-weight: 700; font-size: 16px;
    }
    #hint {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 10; color: white; font: 600 15px Arial, sans-serif;
      text-align: center; text-shadow: 0 2px 8px #000; width: 90%;
      pointer-events: none;
    }
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <div id="start">
    <div class="box">
      <h1>🤖 WebAR</h1>
      <p>Permita o acesso à câmera e aponte o celular para o marcador azul da apresentação.</p>
      <button id="startBtn">ATIVAR CÂMERA</button>
    </div>
  </div>

  <div id="hint" class="hidden">Aponte para a imagem azul da apresentação…</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- O marcador compilado será o target 0 -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- Holograma construído com primitivas A-Frame: não precisa de modelo 3D externo -->
      <a-entity id="robot" position="0 0.05 0.15" scale="0.42 0.42 0.42">

        <!-- brilho/holograma -->
        <a-ring position="0 -0.85 0" rotation="-90 0 0"
                radius-inner="0.55" radius-outer="0.62"
                material="color:#00cfff; shader:flat; opacity:0.7"></a-ring>

        <!-- cabeça -->
        <a-box position="0 0.55 0" width="0.9" height="0.62" depth="0.48"
               material="color:#0b1d35; emissive:#009cff; emissiveIntensity:0.8; transparent:true; opacity:0.88">
        </a-box>

        <!-- visor -->
        <a-box position="0 0.56 0.255" width="0.7" height="0.28" depth="0.03"
               material="color:#001018; emissive:#25d8ff; emissiveIntensity:1.2">
        </a-box>

        <!-- olhos -->
        <a-sphere position="-0.18 0.57 0.285" radius="0.045"
                  material="color:#ffffff; emissive:#00d9ff; emissiveIntensity:2"></a-sphere>
        <a-sphere position="0.18 0.57 0.285" radius="0.045"
                  material="color:#ffffff; emissive:#00d9ff; emissiveIntensity:2"></a-sphere>

        <!-- corpo -->
        <a-cylinder position="0 -0.1 0" radius="0.43" height="0.8"
                     material="color:#0b1d35; emissive:#007dcc; emissiveIntensity:0.7; transparent:true; opacity:0.9">
        </a-cylinder>
        <a-ring position="0 -0.1 0.44" rotation="90 0 0"
                radius-inner="0.09" radius-outer="0.15"
                material="color:#ffffff; emissive:#00d9ff; emissiveIntensity:2"></a-ring>

        <!-- braços -->
        <a-cylinder position="-0.56 -0.05 0" rotation="0 0 -22"
                     radius="0.09" height="0.65"
                     material="color:#0b1d35; emissive:#009cff; emissiveIntensity:0.8"></a-cylinder>
        <a-cylinder id="waveArm" position="0.56 0.15 0" rotation="0 0 -55"
                     radius="0.09" height="0.65"
                     material="color:#0b1d35; emissive:#009cff; emissiveIntensity:0.8"></a-cylinder>

        <!-- mãos -->
        <a-sphere position="-0.68 -0.34 0" radius="0.12"
                  material="color:#0b1d35; emissive:#00bfff; emissiveIntensity:0.8"></a-sphere>
        <a-sphere id="waveHand" position="0.82 0.42 0" radius="0.12"
                  material="color:#0b1d35; emissive:#00bfff; emissiveIntensity:0.8"></a-sphere>

      </a-entity>

      <!-- mensagem holográfica -->
      <a-text id="thanks"
              value="MUITO OBRIGADO!"
              align="center"
              position="0 -0.92 0.08"
              width="2.8"
              color="#54e6ff"
              shader="msdf"
              animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 700; easing: easeOutBack">
      </a-text>

      <a-text
              value="A tecnologia transforma a forma como interagimos com o mundo."
              align="center"
              position="0 -1.15 0.08"
              width="2.0"
              color="#d9f9ff"
              wrap-count="34">
      </a-text>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('#scene');
    const start = document.querySelector('#start');
    const btn = document.querySelector('#startBtn');
    const hint = document.querySelector('#hint');

    btn.addEventListener('click', async () => {
      start.classList.add('hidden');
      hint.classList.remove('hidden');
      const arSystem = scene.systems['mindar-image-system'];
      await arSystem.start();
    });

    const target = document.querySelector('#target');
    target.addEventListener('targetFound', () => {
      hint.textContent = '✨ Marcador reconhecido! Olhe para o robô.';
      document.querySelector('#waveArm').setAttribute(
        'animation__wave',
        'property: rotation; from: 0 0 -55; to: 0 0 -15; dur: 450; dir: alternate; loop: 5; easing: easeInOutSine'
      );
      document.querySelector('#waveHand').setAttribute(
        'animation__wave',
        'property: position; from: 0.82 0.42 0; to: 0.76 0.52 0; dur: 450; dir: alternate; loop: 5'
      );
      document.querySelector('#robot').setAttribute(
        'animation__float',
        'property: position; from: 0 0.05 0.15; to: 0 0.16 0.15; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine'
      );
    });

    target.addEventListener('targetLost', () => {
      hint.textContent = 'Aponte novamente para a imagem azul da apresentação…';
    });
  </script>
</body>
</html>
